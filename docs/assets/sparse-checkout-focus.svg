<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-labelledby="title description">
  <title id="title">Focus by project or path</title>
  <desc id="description">A repository contains api, its shared dependency, tools, AI context and an ignored target cache. Focusing api or excluding tools leaves api, shared, AI context and the cache visible. git-focus full restores tracked source.</desc>
  <style>
    svg { --text:#0f172a; --muted:#64748b; --card:#f8fafc; --border:#cbd5e1; --accent:#2563eb; }
    @media (prefers-color-scheme:dark) { svg { --text:#e2e8f0; --muted:#94a3b8; --card:#0f172a; --border:#334155; --accent:#60a5fa; } }
    text { fill:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    .label { font-size:18px; font-weight:600; }
    .path text { font-family:ui-monospace,Consolas,monospace; font-size:19px; }
    .muted { fill:var(--muted); }
    .command { font-family:ui-monospace,Consolas,monospace; font-size:15px; }
    .card { fill:var(--card); stroke:var(--border); }
    .arrow { fill:none; stroke:var(--accent); stroke-width:2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="var(--accent)"/>
    </marker>
  </defs>
  <text class="label" x="30" y="32">Full repository</text>
  <text class="label" x="630" y="32">Focused working tree</text>
  <rect class="card" x="20" y="48" width="260" height="180" rx="12"/>
  <rect class="card" x="620" y="48" width="260" height="180" rx="12"/>
  <g class="path">
    <text x="44" y="81">api/</text>
    <text x="44" y="111">shared/</text>
    <text x="44" y="141">tools/</text>
    <text class="muted" x="44" y="171">.agents/</text>
    <text class="muted" x="44" y="201">target/</text>
    <text x="644" y="81">api/</text>
    <text x="644" y="111">shared/</text>
    <text class="muted" x="644" y="141">.agents/</text>
    <text class="muted" x="644" y="171">target/</text>
  </g>
  <text class="muted" x="450" y="78" text-anchor="middle" font-size="15">Project or exact paths</text>
  <text class="command" x="450" y="112" text-anchor="middle">git-focus api/Cargo.toml</text>
  <text class="muted" x="450" y="137" text-anchor="middle" font-size="13">or</text>
  <text class="command" x="450" y="162" text-anchor="middle">git-focus exclude tools/</text>
  <path class="arrow" d="M305 192H595" marker-end="url(#arrow)"/>
  <path class="arrow" d="M620 249H280" marker-end="url(#arrow)"/>
  <text class="command" x="450" y="275" text-anchor="middle">git-focus full</text>
  <text class="muted" x="750" y="210" text-anchor="middle" font-size="14">Ignored caches stay</text>
</svg>
