<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
<title id="title">How git-focus narrows a Rust monorepo</title>
<desc id="description">A full repository highlights a selected Cargo project, its transitive dependency, and preserve-listed documentation, tools, scripts, and cache. After git-focus, only those areas are visible; unrelated tracked source is hidden, not deleted.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111c30"/></linearGradient>
<filter id="shadow"><feDropShadow dy="10" stdDeviation="18" flood-color="#020617" flood-opacity=".35"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7dd3fc"/></marker>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.title{fill:#f8fafc;font-size:20px;font-weight:700}.sub{fill:#94a3b8;font-size:14px}.tree{fill:#cbd5e1;font-family:Consolas,monospace;font-size:16px}.muted{fill:#64748b}.tag{font-size:12px;font-weight:700;letter-spacing:.06em}</style>
</defs>
<rect width="1200" height="680" rx="28" fill="url(#bg)"/>
<text x="52" y="55" fill="#f8fafc" font-size="28" font-weight="750">Focus a monorepo without deleting anything</text>
<text x="52" y="82" fill="#94a3b8" font-size="16">Keep the selected project, its local dependency closure, and preserved paths visible.</text>
<g filter="url(#shadow)" fill="#111827" stroke="#263449"><rect x="42" y="115" width="455" height="485" rx="18"/><rect x="703" y="115" width="455" height="485" rx="18"/></g>
<g><circle cx="69" cy="145" r="5" fill="#fb7185"/><circle cx="87" cy="145" r="5" fill="#fbbf24"/><circle cx="105" cy="145" r="5" fill="#4ade80"/><text class="title" x="65" y="185">Full repository</text><text class="sub" x="65" y="208">All tracked source is present</text></g>
<g class="tree"><text x="76" y="250">monorepo/</text><text class="muted" x="96" y="284">├── Cargo.toml</text><text class="muted" x="96" y="318">├── apps/web/</text></g>
<g><rect x="87" y="332" width="382" height="43" rx="8" fill="#123525" stroke="#4ade80" stroke-width="1.5"/><text class="tree" x="100" y="359" fill="#bbf7d0">├── apps/api/</text><rect x="352" y="342" width="104" height="23" rx="11" fill="#166534"/><text class="tag" x="404" y="358" text-anchor="middle" fill="#dcfce7">SELECTED</text></g>
<text class="tree muted" x="96" y="403">├── crates/billing/</text>
<g><rect x="87" y="416" width="382" height="43" rx="8" fill="#102d42" stroke="#38bdf8" stroke-width="1.5"/><text class="tree" x="100" y="443" fill="#bae6fd">├── crates/models/</text><rect x="337" y="426" width="119" height="23" rx="11" fill="#075985"/><text class="tag" x="396.5" y="442" text-anchor="middle" fill="#e0f2fe">DEPENDENCY</text></g>
<g><rect x="87" y="470" width="382" height="108" rx="8" fill="#3a2b12" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 5"/><g class="tree" fill="#fde68a"><text x="100" y="493">├── tools/</text><text x="100" y="517">├── scripts/</text><text x="100" y="541">├── docs/</text><text x="100" y="565">└── target/</text></g><rect x="337" y="478" width="119" height="23" rx="11" fill="#92400e"/><text class="tag" x="396.5" y="494" text-anchor="middle" fill="#fef3c7">PRESERVED</text></g>
<path d="M524 330C568 330 594 330 654 330" fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
<g><rect x="515" y="269" width="178" height="42" rx="10" fill="#172554" stroke="#3b82f6"/><text x="604" y="286" text-anchor="middle" fill="#bfdbfe" font-family="monospace" font-size="12">git-focus</text><text x="604" y="302" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="12">apps/api/Cargo.toml</text><text x="604" y="363" text-anchor="middle" fill="#94a3b8" font-size="13">applies sparse checkout</text></g>
<g><circle cx="730" cy="145" r="5" fill="#fb7185"/><circle cx="748" cy="145" r="5" fill="#fbbf24"/><circle cx="766" cy="145" r="5" fill="#4ade80"/><text class="title" x="726" y="185">Focused working tree</text><text class="sub" x="726" y="208">Only relevant paths are visible</text></g>
<g class="tree"><text x="737" y="250">monorepo/</text><text x="757" y="284">├── Cargo.toml</text><text x="757" y="318" fill="#bbf7d0">├── apps/api/</text><text x="757" y="352" fill="#bae6fd">├── crates/models/</text><text x="757" y="386" fill="#fde68a">├── tools/</text><text x="757" y="420" fill="#fde68a">├── scripts/</text><text x="757" y="454" fill="#fde68a">├── docs/</text><text x="757" y="488" fill="#fde68a">└── target/</text></g>
<g><rect x="736" y="510" width="389" height="44" rx="12" fill="#0f172a" stroke="#334155" stroke-dasharray="5 5"/><text x="930.5" y="529" text-anchor="middle" fill="#94a3b8" font-size="14">Unrelated tracked source is hidden</text><text x="930.5" y="547" text-anchor="middle" fill="#64748b" font-size="12">apps/web · crates/billing</text></g>
<g><rect x="736" y="565" width="389" height="28" rx="10" fill="#10251c" stroke="#246b45"/><text x="930.5" y="584" text-anchor="middle" fill="#bbf7d0" font-size="13" font-weight="650">Git history and hidden files remain untouched</text></g>
<g transform="translate(365 637)"><circle r="6" fill="#4ade80"/><text x="13" y="5" fill="#cbd5e1" font-size="13">selected project</text><circle cx="155" r="6" fill="#38bdf8"/><text x="168" y="5" fill="#cbd5e1" font-size="13">local dependency</text><circle cx="322" r="6" fill="#fbbf24"/><text x="335" y="5" fill="#cbd5e1" font-size="13">preserve list</text></g>
</svg>
